<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture Reference Photo</title>
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }
        #webcam {
            width: 100%;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #canvas {
            display: none;
            width: 100%;
            border: 1px solid #ccc;
        }
        .capture-controls {
            margin-top: 20px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            margin: 0 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #retake-btn, #submit-btn {
            display: none;
        }
        .error-message {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
        .face-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border: 2px dashed #4CAF50;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Capture Reference Photo</h1>
        <p>Please position your face in the center of the frame and click "Capture Photo".</p>
        
        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}
        
        <div id="video-container">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <div class="face-guide"></div>
        </div>
        
        <div class="capture-controls">
            <button id="capture-btn">Capture Photo</button>
            <button id="retake-btn">Retake Photo</button>
            <button id="submit-btn">Submit Photo</button>
        </div>
        
        <form id="photo-form" method="POST" style="display: none;">
            <input type="hidden" name="image_data" id="image-data">
        </form>
    </div>
    
    <script>
        // DOM elements
        const webcam = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const submitBtn = document.getElementById('submit-btn');
        const photoForm = document.getElementById('photo-form');
        const imageData = document.getElementById('image-data');
        
        // Variables
        let stream = null;
        
        // Initialize webcam
        async function initWebcam() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    }
                });
                webcam.srcObject = stream;
                captureBtn.disabled = false;
                
                // Enable debug logging
                console.log('Webcam initialized successfully');
            } catch (err) {
                console.error('Error accessing webcam:', err);
                showError(`Error accessing webcam: ${err.message}`);
            }
        }
        
        // Capture photo
        function capturePhoto() {
            // Set canvas dimensions to match video
            canvas.width = webcam.videoWidth;
            canvas.height = webcam.videoHeight;
            
            // Draw current video frame to canvas
            const ctx = canvas.getContext('2d');
            ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);
            
            try {
                // Convert canvas to data URL (JPEG format)
                const dataURL = canvas.toDataURL('image/jpeg', 0.8);
                imageData.value = dataURL;
                
                // Show preview (use canvas as preview)
                webcam.style.display = 'none';
                canvas.style.display = 'block';
                
                // Update button visibility
                captureBtn.style.display = 'none';
                retakeBtn.style.display = 'inline-block';
                submitBtn.style.display = 'inline-block';
                
                console.log('Photo captured successfully. Data URL length:', dataURL.length);
            } catch (err) {
                console.error('Error capturing photo:', err);
                showError(`Error capturing photo: ${err.message}`);
            }
        }
        
        // Retake photo
        function retakePhoto() {
            // Hide canvas, show webcam
            webcam.style.display = 'block';
            canvas.style.display = 'none';
            
            // Update button visibility
            captureBtn.style.display = 'inline-block';
            retakeBtn.style.display = 'none';
            submitBtn.style.display = 'none';
            
            // Clear image data
            imageData.value = '';
        }
        
        // Submit photo
        function submitPhoto() {
            if (!imageData.value) {
                showError('No photo captured. Please capture a photo first.');
                return;
            }
            
            console.log('Submitting photo...');
            photoForm.submit();
        }
        
        // Show error message
        function showError(message) {
            const errorElement = document.querySelector('.error-message') || document.createElement('div');
            errorElement.className = 'error-message';
            errorElement.textContent = message;
            
            if (!document.querySelector('.error-message')) {
                document.querySelector('.capture-controls').before(errorElement);
            }
        }
        
        // Event listeners
        captureBtn.addEventListener('click', capturePhoto);
        retakeBtn.addEventListener('click', retakePhoto);
        submitBtn.addEventListener('click', submitPhoto);
        
        // Initialize webcam when page loads
        window.addEventListener('DOMContentLoaded', () => {
            captureBtn.disabled = true; // Disable capture button until webcam is ready
            initWebcam();
        });
        
        // Clean up
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
